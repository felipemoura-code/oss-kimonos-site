name: Otimizar fotos originais OSS (execucao unica)
on:
  push:
    paths:
      - '.github/workflows/otimizar-fotos-oss.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  otimizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar conversor de imagem
        run: python -m pip install "Pillow==11.3.0"
      - name: Converter fotos originais, sem alterar originais
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          names = [
            'banner-oss-tres-modelos',
            'hero-modelo-preto',
            'kimono-branco-detalhe',
            'modelo-branco-feminino',
            'oss-logo',
          ]
          for name in names:
              src = Path('assets') / (name + '.png')
              if not src.is_file():
                  raise RuntimeError('Arquivo original OSS nao encontrado: ' + str(src))
              with Image.open(src) as image:
                  image.load()
                  image.thumbnail((1600, 1600), Image.Resampling.LANCZOS)
                  out = Path('assets') / (name + '.webp')
                  image.save(out, format='WEBP', quality=85 if name == 'oss-logo' else 82, method=6)
                  print(f'{name}: {src.stat().st_size} -> {out.stat().st_size} bytes')
          PY
      - name: Salvar WebP e remover workflow temporario
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.webp
          git rm .github/workflows/otimizar-fotos-oss.yml
          git commit -m "Add optimized OSS brand images and remove one-time workflow"
          git push
