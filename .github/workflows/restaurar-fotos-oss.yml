name: Restaurar fotos originais OSS
on:
  push:
    paths:
      - '.github/workflows/restaurar-fotos-oss.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recuperar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recuperar imagens originais do pacote enviado
        run: |
          git show eac27eeebadff4726f0edb09dbd48fd9a0896650:OSS_KIMONOS_SITE_COM_FOTOS_E_LOJA.zip > /tmp/oss-site.zip
          python3 - <<'PY'
          import zipfile, os
          allowed = {'banner-oss-tres-modelos.png', 'hero-modelo-preto.png', 'kimono-branco-detalhe.png', 'modelo-branco-feminino.png', 'oss-logo.png'}
          with zipfile.ZipFile('/tmp/oss-site.zip') as z:
              for member in z.namelist():
                  if member.startswith('assets/') and member.split('/')[-1] in allowed:
                      os.makedirs('assets', exist_ok=True)
                      with open(member, 'wb') as f:
                          f.write(z.read(member))
          PY
      - name: Publicar as fotos no repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          if ! git diff --cached --quiet; then
            git commit -m "Restaurar fotografias oficiais da OSS Kimonos"
            git push origin HEAD:main
          fi
